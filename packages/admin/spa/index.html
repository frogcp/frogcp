         than a <link> here: `test/serving.test.ts` requires every `<link
         href>`/`<script src>` in the served shell to resolve through this
         backend's own asset route, and an external Google Fonts <link> would
         404 that check. A CSS-level @import loads the same fonts without
         appearing in the HTML at all. -->

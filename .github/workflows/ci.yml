name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The CLI tests load configs that import the built `frogcp` package, so the
      # framework must be built before the suite runs.
      - run: pnpm --filter frogcp build
      - run: pnpm -r typecheck
      - run: pnpm -r test
